spawn:
  arthur: |-
    ⚔️ <b>ОБНАРУЖЕН ХУЙ КОРОЛЯ АРТУРА</b>

    Кто осмелится вытащить его из камня?

    Один хуй тебе или два другому?
  hyperboreic: |-
    ⚠️ <b>ОБНАРУЖЕН ГИПЕРБОРЕЙСКИЙ ХУЙ</b>

    Кто первый схватит — тому решать судьбу своего хуя.

    Один хуй тебе или два другому?

buttons:
  self: "Один мне"
  other: "Два другому"

alerts:
  taken: "Хуй уже унесли."
  error: "Хуй отказался определяться. Попробуй ещё раз."
  missing: "Гном ещё не зарегистрирован в этом чате."

other:
  answer:
    exploded: "Два другому. Выбор сделан."
    unchanged: "Два другому. Ничего не произошло."
  exploded:
    arthur: |-
      ⚔️ Выбор пал на <b>{title}</b>.

      Хуй Короля Артура увидел, что у гнома уже нет хуя, и разорвал его на величественные хуйные молекулы.

      💀 Очки: <b>0 / 100</b>
      🍆 Хуй: <b>потерян</b>
    hyperboreic: |-
      🍆 Выбор пал на <b>{title}</b>.

      У гнома уже не было хуя, поэтому гиперборейский хуй разорвал его на хуйные молекулы.

      💀 Очки: <b>0 / 100</b>
      🍆 Хуй: <b>потерян</b>
  unchanged:
    arthur: |-
      ⚔️ Выбор пал на <b>{title}</b>, но ничего не произошло.

      Хуй Короля Артура остался в камне.
    hyperboreic: |-
      🍆 Выбор пал на <b>{title}</b>, но ничего не произошло.

      Гиперборейский хуй молча исчез.

self:
  restored:
    arthur:
      alert: "НЕ СМОГ ВЫТАЩИТЬ ХУЙ КОРОЛЯ АРТУРА. НО ОН ВСЁ РАВНО ВЕРНУЛСЯ! 🍆"
      message: |-
        ⚔️ <b>{title}</b> попытался вытащить <b>ХУЙ КОРОЛЯ АРТУРА</b>.

        ❌ Не смог вытащить хуй.

        Но легендарный хуй каким-то образом сам вернулся к своему владельцу.

        🍆 <b>ХУЙ ВСЁ РАВНО ВОЗВРАЩЁН.</b>
    hyperboreic:
      alert: "ХУЙ ВОЗВРАЩЁН! 🍆"
      message: "🍆 <b>{title}</b> схватил гиперборейский хуй и вернул себе свой собственный."
  exploded:
    arthur:
      alert: "НЕ СМОГ ВЫТАЩИТЬ ХУЙ КОРОЛЯ АРТУРА. ТЕБЯ РАЗОРВАЛО НА ВЕЛИЧЕСТВЕННЫЕ ХУЙНЫЕ МОЛЕКУЛЫ."
      message: |-
        ⚔️ <b>{title}</b> попытался вытащить <b>ХУЙ КОРОЛЯ АРТУРА</b>.

        ❌ Не смог вытащить хуй.

        💥 Но Хуй Короля Артура не потерпел такого надругательства над своим величием.

        Тело гнома разорвало на <b>величественные хуйные молекулы</b>.

        💀 Очки: <b>0 / 100</b>
        🍆 Хуй: <b>УНИЧТОЖЕН</b>
    hyperboreic:
      alert: "ТЕБЯ РАЗОРВАЛО НА ХУЙНЫЕ МОЛЕКУЛЫ."
      message: |-
        💥 <b>{title}</b> попытался схватить гиперборейский хуй.

        От передозировки хуев гнома разорвало на хуйные молекулы.

        💀 Очки: <b>0 / 100</b>
        🍆 Хуй: <b>потерян</b>
