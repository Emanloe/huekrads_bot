phrases:
  attack:
  - замахивается засапожным свинорезом
  - резко подсекает соперника тяжёлым поджильным ножом
  - тычет в цель шахтёрским скальпелем, заточенным до неприличия
  - выполняет молниеносный выпад кованым джамбием
  - пытается нанести коварный тычок под ребро
  - рубит снизу тяжёлым кузнечным тесаком
  - выкидывает грязный финт короткой гномьей заточкой
  hit:
  - с хрустом вонзает гномью сталь прямо в цель!
  - вспарывает промасленную жилетку и добирается до мяса!
  - находит щель в защите и всаживает туда нож!
  - сбивает соперника с ног коротким боковым подрезом!
  - ставит жирную точку точным тычком под рёбра!
  block:
  - успевает подставить тяжелый обух и сбивает траекторию!
  - ловит клинок тяжёлой рукоятью и отводит удар!
  - подставляет кожаный наруч и ржёт противнику в лицо!
  - предугадывает подлость и блокирует выпад широким лезвием!
  - перехватывает запястье сухой мозолистой рукой!
  miss:
  - поскальзывается на пролитом эле и режет воздух!
  - теряет равновесие и высекает ножом искры из мифриловой жилы!
  - промахивается в миллиметре от цели и режет собственное голенище!
  - зацепляется сапогом за пень и шлепается брюхом в грязь!
  - нож выскальзывает из жирных после рульки ладоней!
  suicide:
  - пытается изобразить эльфийский финт и всаживает свинорез себе в колено!
  - спотыкается о собственную бороду и натыкается на свое же лезвие!
  - подбрасывает нож ради понтов и ловит его печенью!
  - выполняет опасный кувырок и случайно подрезает сам себе жилы!
  - слишком широко замахивается и сам же вырубает себя рукоятью!
