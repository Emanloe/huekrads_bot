    <b>{attacker_title}</b> {attack_phrase} в зону ({target_name}), но {miss_phrase}

    🔄 <b>Смена ролей!</b>
    ⚔️ Атакует: <b>{next_attacker_title}</b>
    🛡️ Защищается: <b>{next_defender_title}</b>

    ⏳ У <b>{next_attacker_title}</b> есть {move_timeout} секунд на удар:
  block: |-
    🛡️ <b>БЛОК СРАБОТАЛ!</b>
    <b>{attacker_title}</b> {attack_phrase} в зону ({target_name}), но <b>{defender_title}</b> {block_phrase}

    🔄 <b>Инициатива переходит!</b>
    ⚔️ Атакует: <b>{next_attacker_title}</b>
    🛡️ Защищается: <b>{next_defender_title}</b>

    ⏳ У <b>{next_attacker_title}</b> есть {move_timeout} секунд на удар:
round_flavor:
  one:
  - ⚡ <b>Срезал в касание!</b> Противник даже не успел понять, что произошло.
  - 🚀 <b>Ваншот!</b> Одно мгновение — и дуэль окончена.
  - 🎯 <b>Быстрый чек!</b> Вышел. Зарезал. Даже пиво не поставил.
  - 🐟 <b>Тюленьим жиром по лбу!</b> Противник поскользнулся на самом себе и ёбнулся затылком.
  - 🎺 <b>Трубач играл!</b> Дунул так, что у врага лопнули перепонки. Душа вышла следом.
  - 🍑 <b>Удар жопой!</b> Гном развернулся, подпрыгнул и приземлился задом на голову противника. Тот сдох от унижения.
  - 🌀 <b>Смерч из бороды!</b> Раскрутился так, что борода намотала противника и раскидала его по арене.
  - 🧦 <b>Вонючим носком в лицо!</b> Сам удар пережил. Запах — нет.
  - 🦆 <b>Утка-крякалка!</b> Гном достал резиновую утку, крякнул — врага парализовало. Добил уткой же.
  - 🪑 <b>Табуреткой по короне!</b> Откуда табуретка? Никто не знает. Но череп треснул.
  - 🎣 <b>На крючок!</b> Зацепил врага за бороду и дёрнул так, что тот покинул арену вертикально.
  - 🧠 <b>Вынул мозги через ухо!</b> Долго ковырялся, зато теперь там просторно.
  - 🥚 <b>Яйцом по голове!</b> Обычным куриным. Но умереть от яйца всё равно умудрился.
  few:
  - ⚔️ <b>Быстрая рубка!</b> Гномы едва успели запыхаться.
  - 🔥 <b>Короткий, но яркий бой!</b> Искры летели во все стороны.
  - 🍺 <b>Даже пиво не остыло!</b> Скоротечная схватка.
  - 🦷 <b>Зубная фея пришла!</b> Выбил все зубы. Подушки не нашлось, поэтому сложил их обратно в карман владельцу.
  - 🧹 <b>Помелом по спине!</b> Метлу выдал гном-дворник. Он вообще-то просто мимо шёл.
  - 🍌 <b>Поскользнулся на шкурке!</b> Упал прямо на собственный топор. Банан свою работу выполнил.
  - 🔔 <b>Колокольчик!</b> Позвенел, враг застыл как вкопанный. Гном аккуратно снял с него шкуру и сделал коврик.
  - 🦞 <b>Крабовая атака!</b> Гном достал живого краба и щипнул врага за яйца. Тот закричал на полтона выше.
  - 🪣 <b>Ведро на голову!</b> Противник ничего не видел, споткнулся и сломал шею. Ведро сделало больше, чем оба дуэлянта.
  - 🧀 <b>Сыр в лицо!</b> Липкий, вонючий, с плесенью. Враг вдохнул неудачно и умер, проклиная молочную промышленность.
  - 🦅 <b>Орёл-мутант!</b> Гном свистнул. Орёл прилетел, забрал глаз и улетел. Остальное доделал гном.
  - 🪤 <b>Мышеловка!</b> Враг наступил — нога осталась в ловушке. Гном забрал обе.
  - 🎈 <b>Воздушный шарик!</b> Лопнул над ухом врага. Тот подпрыгнул и убился об люстру. Да, на арене была люстра. Не доёбывайтесь.
  several:
  - 🛡️ <b>Плотное рубилово!</b> Достойный поединок двух мастеров.
  - 💥 <b>Затяжная дуэль!</b> Борода против бороды, топор против топора.
  - 🩸 <b>Потная заруба!</b> Оба гнома оставили немало сил на арене.
  - 🧸 <b>Плюшевым мишкой по спине!</b> Ударил так уверенно, что враг даже не сразу понял, насколько это унизительно.
  - 🪥 <b>Зубной щёткой!</b> Споткнулся во время чистки зубов и загнал щётку врагу в горло. Свежее дыхание оказалось последним.
  - 🧻 <b>Рулон туалетной бумаги!</b> Замотал врага в кокон, пнул под зад — и тот укатился с арены.
  - 🥕 <b>Морковкой в глаз!</b> Обычной. Морковка сломалась. Глаз тоже.
  - 🎻 <b>Скрипка!</b> Сыграл так фальшиво, что у врага сначала лопнули перепонки, а потом терпение и сердце.
  - 🪚 <b>Пила!</b> Гном полчаса пилил воздух рядом с врагом. Тот устал смотреть и сдался насмерть.
  - 🐸 <b>Жаба!</b> Засунул врагу жабу в рот. Жаба была жирная. Враг — недостаточно широкий.
  - 🎣 <b>Удочка!</b> Зацепил врага за бороду и потащил к себе. Тот дёрнулся, навернулся и сложился пополам.
  - 🧊 <b>Кубик льда!</b> Засунул за шиворот. Враг дёрнулся и убился об собственный топор. Лёд чист.
  - 📌 <b>Кнопка!</b> Вошла в пятку. Остальное противник сделал с собой сам.
  many:
  - 👵 <b>Дедовская осада!</b> Бой длился так долго, что у участников выросли новые бороды.
  - 🐌 <b>Эпическая тягомотина!</b> Зрители успели уснуть и проснуться.
  - 🪨 <b>Встретились два камня!</b> Это была дуэль на измор.
  - 🌌 <b>Чёрная дыра!</b> Гном открыл рот и засосал туда врага вместе с половиной арены. Потом рыгнул песком.
  - ⏳ <b>Машина времени!</b> Гном сходил в прошлое и решил вопрос ещё до начала дуэли. На арене остался только временной штраф.
  - 🤖 <b>Робот-гном!</b> Выстрелил лазерами из глаз, испепелил врага и тут же сел. Батарейки закончились.
  - 🍕 <b>Пицца!</b> Швырнул горячую пиццу врагу в лицо. Враг умер. Пиццу жалко.
  - 🎮 <b>Контроллер!</b> Гном нажал 'Alt+F4'. Враг исчез. Дуэль закрылась без сохранения.
  - '🧙 <b>Магия без магии!</b> Гном сказал: «Ты уже умер». Враг три часа доказывал обратное и в итоге умер от спора.'
  - 🦄 <b>Единорог!</b> Прискакал, проткнул врага рогом в пупок и ускакал. Кровь почему-то была радужная. Никто не стал уточнять.
  - 🪐 <b>Сатурн!</b> Гном достал кольцо Сатурна и затянул на шее врага. Астрономы против, но враг уже мёртв.
  - 📦 <b>Ящик «Сюрприз»!</b> Внутри второй ящик. В нём третий. К четвёртому враг уже умер от заёба.
  - 🧩 <b>Пазл!</b> Разобрал врага по частям и собрал обратно. Лишние детали остались, инструкция потерялась, враг долго не прожил.
