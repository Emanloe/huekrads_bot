catalog:
  deep_snouted_baron:
    name: Глубокорылый Барон
    emoji: 👹
    description: Древний владыка шахт. У него три подбородка, семь ножей и абсолютно нулевая терпимость к гномам.
  dick_crusher_face_eater:
    name: Хуекрушитель Мордогрыз
    emoji: 💀
    description: Монстр настолько злой, что однажды укусил собственную бороду и победил.
  prince_of_underground_chaos:
    name: Князь Подземного Пиздеца
    emoji: 👑
    description: Повелитель нижних штолен. Его корона сделана из сломанных гномьих ножей.
  great_knife_beard:
    name: Великий Ножебород
    emoji: 🧔
    description: Его борода настолько острая, что ею можно нарезать колбасу и участников.
  dick_devourer:
    name: Пожиратель Хуев
    emoji: 🦷
    description: Никто не знает, сколько хуев он уже съел. Сам он тоже не знает. Он просто продолжает.
zones:
  display:
    head: Голова
    body: Торс
    dick: Хуй
  unknown: неизвестную зону
death_epitaphs:
  - |-
    💀 <b>{title}</b> пал в раунде <b>{round_num}</b>. Бил в <b>{attack_zone}</b>, защищал <b>{defended_zone}</b>, а <b>{boss_name}</b> пришёл в <b>{death_zone}</b>. Гномская разведка считает это смелостью. Гномская бухгалтерия — ошибкой.
  - |-
    ☠️ <b>{title}</b> держался до раунда <b>{round_num}</b>, после чего <b>{boss_name}</b> объяснил разницу между «я защищаюсь» и «я угадал не туда». Удар пришёл в <b>{death_zone}</b>, блок стоял в <b>{defended_zone}</b>.
  - |-
    🪦 Здесь мог бы стоять памятник <b>{title}</b>. Он бил в <b>{attack_zone}</b>, прикрывал <b>{defended_zone}</b> и в раунде <b>{round_num}</b> получил от босса в <b>{death_zone}</b>. Памятник решили не ставить: металл нужен для новых ножей.
  - |-
    💀 <b>{title}</b> совершил тактическое отступление прямо в могилу. Произошло это в раунде <b>{round_num}</b>: атака — <b>{attack_zone}</b>, защита — <b>{defended_zone}</b>, босс — в <b>{death_zone}</b>. Совпадение? Нет. Судьба.
death:
  round_fallback: последнем
phase:
  player_status: • <b>{title}</b> — {status}
  attack: |-
    💀 <b>{boss_name} — РАУНД {round}</b>

    ⚔️ <b>ФАЗА АТАКИ</b>
    Каждый живой игрок выбирает, куда ударить босса.

    🎯 Урон боссу: <b>{hits} / {required_hits}</b>
    👥 В живых: <b>{alive_count} / {total_count}</b>

    <b>Игроки:</b>
    {players_status}

    ⚔️ Выберите зону атаки:
  block: |-
    💀 <b>{boss_name} — РАУНД {round}</b>

    🛡 <b>ФАЗА ЗАЩИТЫ</b>
    Босс сейчас атакует. Каждый живой игрок выбирает, какую зону защищать.

    🎯 Урон боссу: <b>{hits} / {required_hits}</b>
    👥 В живых: <b>{alive_count} / {total_count}</b>

    <b>Игроки:</b>
    {players_status}

    🛡 Выберите зону защиты:
join:
  button: ⚔️ Присоединиться
keyboards:
  attack:
    head: ⚔️ Голова
    body: ⚔️ Торс
    dick: ⚔️ Хуй
  block:
    head: 🛡 Голова
    body: 🛡 Торс
    dick: 🛡 Хуй
registration:
  group_only: ⚔️ Записываться на гномью бойню можно только в группе.
  closed: Извинитесь. Битва уже была, запишитесь завтра до 18:00
  active: ⚔️ Битва уже идёт. На неё запись закрыта.
  registered: |-
    ⚔️ <b>Гном записан на сегодняшнюю бойню.</b>

    В 18:00 твоя борода сама окажется на арене. Нож бери с собой.
  already_registered: |-
    🍺 Ты уже записан на сегодняшнюю бойню.

    В 18:00 просто приходи рубиться.
command:
  forbidden: ⛔ Недостаточно прав.
  group_only: 👹 Босс запускается только в групповом чате.
  active: 👹 В этом чате уже идет битва с боссом.
callback:
  battle_finished: Битва уже закончилась.
  join:
    already_started: Битва уже началась.
    already_participating: Ты уже участвуешь.
    joined: Ты вступил в битву! ⚔️
    progress: |-
      💀 <b>{boss_name}</b>

      👹 Босс готов к битве!

      👥 Участников: <b>{participants}</b>

      ⚔️ Присоединяйтесь к бойне.
  attack_phase_closed: Сейчас фаза защиты.
  not_participant: Ты не участвуешь в битве.
  dead: Ты уже погиб.
  stale_button: Устаревшая кнопка.
  round_finished: Этот раунд уже закончился.
  unknown_zone: Неизвестная зона.
  attack_ack: "Атака: {zone} ⚔️"
  block_phase_closed: Сначала все должны выбрать атаку.
  block_ack: "Защита: {zone} 🛡"
battle:
  spawn: |-
    💀 <b>{boss_name}</b>

    👹 В чат явился босс!

    🎯 Его нужно поразить <b>{required_hits} раз</b>.
    💀 Босс убивает с одного удара, если игрок не заблокировал нужную зону.

    ⚔️ Нажимайте кнопку ниже, чтобы присоединиться.
  pre_registered: |-
    💀 <b>{boss_name}</b>

    👹 Босс явился в подземелье!

    ⚔️ Заранее записались: <b>{participants}</b>

    Другие храбрецы ещё могут вступить в бой.
  empty_join_timeout: |-
    💀 <b>{boss_name}</b>

    Никто не осмелился вступить в битву.

    Босс ушёл ждать более храбрых гномов.
timeout:
  auto_attack: "⚔️ <b>{title}</b> зазевался. Нож сам пошёл в <b>{zone}</b>."
  auto_block: "🛡 <b>{title}</b> зазевался. Рука сама прикрыла <b>{zone}</b>."
round:
  attack_result:
    hit: 💥 ПОПАДАНИЕ
    miss: 💨 ПРОМАХ
  block_result:
    survived: 🛡 ЗАБЛОКИРОВАЛ
    dead: 💀 УБИТ
  participant_result: |-
    <b>{title}</b>
    ⚔️ {attack_zone} → {attack_result}
    🛡 {block_zone} → {block_result}
  summary: |-
    💥 <b>РАУНД {round} — РЕЗУЛЬТАТ</b>

    👹 Босс атаковал: <b>{boss_attack}</b>
    🛡 Босс защищал: <b>{boss_block}</b>

    {results}

    🎯 Урон боссу: <b>{hits} / {required_hits}</b>
    👥 В живых: <b>{alive_after}</b> / <b>{total}</b>
survivor:
  phrases:
    terminator: рубился как настоящий гномий терминатор
    target: превратил босса в тренировочную мишень
    evasive: оказался подозрительно хорош в умении не умереть
    marked: хотя бы успел оставить на боссе несколько зарубок
    brazen: выжил почти исключительно благодаря наглости
  summary: |-
    🛡 <b>{title}</b> — выжил. {phrase}. Попаданий: <b>{hits}</b>, промахов: <b>{misses}</b>, блоков: <b>{blocks}</b>, пережито раундов: <b>{survived}</b>.
report:
  fallback: '💀 <b>БИТВА ОКОНЧЕНА</b>\n\nБосс больше не сражается. Гномская летопись почему-то отказалась писать подробности.'
  victory:
    title: 🏆 <b>ЛЕГЕНДА БИТВЫ</b>
    boss_defeated: 👹 <b>{boss_name}</b> пал после <b>{hits}</b> попаданий.
    duration: |-
      ⚔️ Продолжительность: <b>{round}</b> {round_word}.
    team: |-
      👥 Отряд: <b>{total}</b> — выжило <b>{survivors}</b>, погибло <b>{dead}</b>.
    survivors_header: 🛡 <b>ВЫЖИВШИЕ:</b>
    dead_header: 💀 <b>ПАВШИЕ ГЕРОИ:</b>
    hero: |-
      👑 <b>ГЕРОЙ БИТВЫ: {hero_title}</b>
    hero_stats: Нанёс <b>{hits}</b> попаданий, сделал <b>{blocks}</b> блоков и пережил <b>{rounds_survived}</b> {round_word}.
    reward_points: |-
      💯 <b>Награда:</b> всем выжившим установлено 100 очков.
    reward_dick: 🍆 Украденный сегодня хуй возвращён.
    decree: |-
      👑 <b>Великий бог хуекрадов постановил:</b> сегодня эти гномы официально слишком охуенны, чтобы умереть.
  defeat:
    title: 💀 <b>ПОСМЕРТНАЯ ЛЕТОПИСЬ ОТРЯДА</b>
    boss_standing: 👹 <b>{boss_name}</b> остался стоять.
    hits: 🎯 Гномы нанесли <b>{hits}</b> из <b>{required_hits}</b> нужных попаданий.
    duration: ⚔️ Отряд продержался <b>{round}</b> {round_word}.
    team: |-
      👥 Участников: <b>{total}</b>. Выжили: <b>0</b>.
    dead_header: 💀 <b>КАК ВСЕ УМЕРЛИ:</b>
    hero: |-
      🩸 <b>ПОСЛЕДНИЙ НАСТОЯЩИЙ ГНОМ: {hero_title}</b>
    hero_stats: На его счету <b>{hits}</b> попаданий и <b>{blocks}</b> блоков. Умер, но статистику уже не отнять.
    verdict: |-
      📜 <b>Вердикт:</b> гномы были храбрыми. Но босс был охуенно внимательным.
